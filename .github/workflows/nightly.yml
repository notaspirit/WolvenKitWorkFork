name: WolvenKit-Nightly
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: wolvenkit-nightly
  cancel-in-progress: false

env:
  FINALOUT: ./publish
  NAME: WolvenKit
  MREPO: ${{github.repository}}
  WINGET_ID: REDModding.WolvenKit.Nightly

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - id: should_run
        name: check latest commit is less than a day
        run: |
          myvar=$(git rev-list --after="24 hours" HEAD)
          if (test ! -z "$myvar"); then HAS_COMMITS='true'; else HAS_COMMITS='false'; fi;
          echo "$HAS_COMMITS"
          echo "should_run="$HAS_COMMITS"" >> $GITHUB_OUTPUT

  nightly-wkit-win:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run == 'true' }}
    runs-on: windows-2022

    steps:

      ##########################################
      # SETUP

      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Get commit
        run: |
          $commit = git log -1 --format=%H
          echo "SHA=$commit" >> $env:GITHUB_ENV

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Get Version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          $revision = 1

          while ($true) {
              $tag = "nightly.$date.r$revision"

              git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null

              if ($LASTEXITCODE -ne 0) {
                  break
              }

              $revision++
          }

          $version = "nightly.$date.r$revision"

          echo "ISODATE=$date" >> $env:GITHUB_ENV
          echo "VERSION_APP=$version" >> $env:GITHUB_ENV
          echo "TAG=$tag" >> $env:GITHUB_ENV

          Write-Host "Using version: $version"
          exit 0
      - run: echo "PORTABLE=${{env.NAME}}-${{env.VERSION_APP}}.zip" >> $env:GITHUB_ENV

      ##########################################
      # APP

      # Publish app
      - run: dotnet publish ./WolvenKit/WolvenKit.csproj -o ./publish/app/ -c Release -p:InformationalVersion="${{env.VERSION_APP}}" -p:Version="${{env.VERSION_APP}}" -p:FileVersion="0.0.0.0" -p:AssemblyVersion="0.0.0.0" -p:DebugType=None -p:DebugSymbols=false
      - run: Compress-Archive -Path ./publish/app/* -DestinationPath ${{env.FINALOUT}}/${{env.PORTABLE}}

      ##########################################
      # CONSOLE

      - run: echo "CONSOLE=${{env.NAME}}.Console-${{env.VERSION_APP}}.zip" >> $env:GITHUB_ENV

      # Publish console
      - name: publish console
        run: dotnet publish ./WolvenKit.CLI/WolvenKit.CLI.csproj -o ./publish/console/ -c Release -p:InformationalVersion="${{env.VERSION_APP}}" -p:Version="${{env.VERSION_APP}}" -p:FileVersion="0.0.0.0" -p:AssemblyVersion="0.0.0.0" -p:DebugType=None -p:DebugSymbols=false
      - name: zip console
        run: Compress-Archive -Path ./publish/console/* -DestinationPath ${{env.FINALOUT}}/${{env.CONSOLE}}

      ##########################################
      # INSTALLER

      - name: create installer
        run: ISCC /O"${{env.FINALOUT}}" /dMyAppBaseDir="..\publish\app\" /dMyAppName="WolvenKit Nightly" /dMyAppId="WolvenKit-Nightly" .\Installers\installer.iss

      ##########################################
      # UNPACKER

      - name: publish unpacker
        run: dotnet publish ./WolvenKit.Unpacker/WolvenKit.Unpacker.csproj -o ./publish/unpacker/ -c Release -p:DebugType=None -p:DebugSymbols=false
      - name: zip unpacker
        run: Compress-Archive -Path ./publish/unpacker/* -DestinationPath ${{ env.FINALOUT }}/${{env.NAME}}.Unpacker-${{env.VERSION_APP}}.zip

      ##########################################
      # RELEASE

      - name: Create tag
        run: |
          git tag "${{env.VERSION_APP}}"
          git push origin "${{env.VERSION_APP}}"

      - name: Release dispatch
        id: release_dispatch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_APP }}
          generate_release_notes: false
          files: |
            ${{ env.FINALOUT }}/*.zip
            ${{ env.FINALOUT }}/*.exe
          body: "This is a beta release so you may encounter bugs. Please report them."
