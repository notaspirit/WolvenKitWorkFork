name: check-only
on:
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.csx'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.resx'
      - '**/*.xaml'
  push:
    branches: [main, dev]
    paths:
      - '**/*.cs'
      - '**/*.csx'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.resx'
      - '**/*.xaml'

jobs:
  desktop-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
          
      - name: Show SDK version
        run: |
          dotnet --info
          dotnet --list-sdks
          
      - name: Inspect failing source
        shell: pwsh
        run: |
          $file = "WolvenKit.App/ViewModels/Tools/ChunkViewModelExtended/ChunkViewModel.Value.cs"
          $lines = Get-Content $file
          1308..1325 | ForEach-Object {
            "{0}: {1}" -f $_, $lines[$_ - 1]
          }

      - name: Compiler diagnostics
        run: |
          dotnet --info
          dotnet build WolvenKit.App/WolvenKit.App.csproj -c Release -v:diag
      
      - name: Publish with Dotnet
        run: dotnet publish .\WolvenKit\WolvenKit.csproj -o .\publish -c Release -p:DebugType=None -p:DebugSymbols=false

      - uses: actions/upload-artifact@v4
        with:
          name: wolvenkit-desktop
          path: .\publish

  console-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore ./WolvenKit.CLI/WolvenKit.CLI.csproj
      - name: Build
        run: dotnet build ./WolvenKit.CLI/WolvenKit.CLI.csproj --no-restore  -p:DebugType=None -p:DebugSymbols=false
