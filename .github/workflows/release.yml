name: release
on:
  workflow_dispatch:

env:
  PROJ: ./WolvenKit/WolvenKit.csproj
  PROJC: ./WolvenKit.CLI/WolvenKit.CLI.csproj
  PROJU: ./WolvenKit.Unpacker/WolvenKit.Unpacker.csproj
  ARTIFACT_CLI_LIN: wolvenkit-cli-linux

jobs:
  console-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish with Dotnet
        run: dotnet publish ${{env.PROJC}} -o ./publish_cli_linux -r linux-x64 -c Release --no-self-contained -p:DebugType=None -p:DebugSymbols=false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_CLI_LIN}}
          path: ./publish_cli_linux

  release:
    runs-on: windows-latest
    needs: [console-linux]
    env:
      OUT_DIR: ./release
      NAME: WolvenKit
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      ##########################################
      # VERSIONS

      # Read the NuGet/SemVer version from the app project, including prerelease suffixes.
      - name: Get app version
        id: get_version
        shell: pwsh
        run: |
          $version = (dotnet msbuild "$env:PROJ" -getProperty:Version).Trim()
          if (-not $version) {
            throw "Could not determine Version from $env:PROJ"
          }

          "VERSION_APP=$version" >> $env:GITHUB_ENV

          $isPrerelease = $version -match '(alpha|beta|rc)'
          "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "Detected version: $version"
          "Is prerelease: $isPrerelease"

      - name: Create Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a ${{env.VERSION_APP}} -m "Release ${{env.VERSION_APP}}"
          git push origin --tag ${{env.VERSION_APP}}

      ##########################################
      # CHANGELOG

      - name: Read MD Version Changelog
        id: md_changelog
        shell: bash
        run: |
          {
            echo 'content<<EOF'
            cat changelog/generated/CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Read BB Version Changelog
        id: bb_changelog
        shell: bash
        run: |
          {
            echo 'content<<EOF'
            cat changelog/generated/CHANGELOG.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Populate Release Template
        shell: pwsh
        env:
          CHANGELOG: ${{ steps.md_changelog.outputs.content }}
        run: (Get-Content RELEASE.md -Raw) -replace '{CHANGELOG}', $env:CHANGELOG | Set-Content RELEASE.md

      ##########################################
      # APP

      # Publish app to .\publish
      - name: publish app
        run: dotnet publish ${{env.PROJ}} -o .\publish -c Release -p:DebugType=None -p:DebugSymbols=false

      ##########################################
      # CONSOLE

      # Publish console to .\publish_cli
      - name: publish console
        run: dotnet publish ${{env.PROJC}} -o .\publish_cli -r win-x64 -c Release --no-self-contained -p:DebugType=None -p:DebugSymbols=false

      ##########################################
      # UNPACKER

      # Publish unpacker to .\publish_unpacker
      - name: publish unpacker
        run: dotnet publish ${{env.PROJU}} -o .\publish_unpacker -c Release -p:DebugType=None -p:DebugSymbols=false

      ##########################################
      # Download artifacts to .\download
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: download

      ##########################################
      # create release files

      # Install InnoSetup
      - name: install InnoSetup
        shell: cmd
        run: choco upgrade innosetup -y --no-progress

      # Create Installer in OUT_DIR
      - name: create setup
        run: ISCC /O"${{env.OUT_DIR}}" .\Installers\installer.iss

      # compress portables to OUT_DIR
      - run: Compress-Archive -Path .\publish\* -DestinationPath ${{ env.OUT_DIR }}/${{env.NAME}}-${{env.VERSION_APP}}.zip
      - run: Compress-Archive -Path .\publish_cli\* -DestinationPath ${{ env.OUT_DIR }}/${{env.NAME}}.Console-${{env.VERSION_APP}}.zip
      - run: Compress-Archive -Path ".\download\${{env.ARTIFACT_CLI_LIN}}\*" -DestinationPath ${{ env.OUT_DIR }}/${{env.NAME}}.ConsoleLinux-${{env.VERSION_APP}}.zip
      - run: Compress-Archive -Path .\publish_unpacker\* -DestinationPath ${{ env.OUT_DIR }}/${{env.NAME}}.Unpacker-${{env.VERSION_APP}}.zip

      ##########################################
      # RELEASE

      - name: Release dispatch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_APP }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: false
          body_path: "RELEASE.md"
          files: |
            ${{ env.OUT_DIR }}/*.zip
            ${{ env.OUT_DIR }}/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
